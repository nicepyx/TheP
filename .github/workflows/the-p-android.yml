name: The P Android Alpha
on:
  push:
    paths: ['the-p-android/**', '.github/workflows/the-p-android.yml']
  pull_request:
    paths: ['the-p-android/**', '.github/workflows/the-p-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-p-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck assembleDebug testDebugUnitTest :core:model:test
      - run: ./gradlew lintDebug --no-parallel
      - uses: actions/upload-artifact@v4
        with:
          name: TheP-Alpha-debug
          path: the-p-android/app/build/outputs/apk/debug/app-debug.apk
