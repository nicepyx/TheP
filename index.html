function bodyChart(weights){if(weights.length<2)return '<p class="subtle-info">至少录入2天体重数据，才会出现变化曲线。</p>';let vals=weights.slice(-16).map(x=>Number(x.weight)),max=Math.max(...vals)+.5,min=Math.min(...vals)-.5;const x0=25,y0=21,W=290,H=90;const pts=vals.map((v,i)=>[x0+i/(vals.length-1)*W,y0+(max-v)/(max-min)*H]);const coords=pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');return `<div class="body-chart"><svg viewBox="0 0 342 150" role="img" aria-label="最近${vals.length}次体重记录趋势"><defs><linearGradient id="weightGradient" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#36a9ee" stop-opacity=".28"/><stop offset="1" stop-color="#36a9ee" stop-opacity="0"/></linearGradient></defs><path d="M25 21H315M25 66H315M25 111H315" stroke="#c3e2f4" stroke-width="1" stroke-dasharray="4 5"/><polygon points="25,111 ${coords} 315,111" fill="url(#weightGradient)"/><polyline points="${coords}" fill="none" stroke="#268fdf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#46b7ec"/>`).join('')}<text x="26" y="135" fill="#6c91b0" font-size="11">${esc(weights.slice(-16)[0].date.slice(5))}</text><text x="313" y="135" fill="#6c91b0" text-anchor="end" font-size="11">${esc(weights.at(-1).date.slice(5))}</text><text x="310" y="15" text-anchor="end" fill="#1478ca" font-size="12" font-weight="bold">最新 ${vals.at(-1).toFixed(1)} kg</text></svg></div>`}

function download(filename,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

function trainingHistoryModal(key){const s=data.sessions[key];if(!s)return;const day=key.split('__')[1],date=key.split('__')[0];const title=SCHEDULE.find(d=>d.key===day)?.title||day;let rows=(EXERCISES[day]||[]).map(ex=>{const a=s.sets[ex.id]||[];return `<div class="record-row"><div><b>${esc(ex.name)}</b><p>${a.filter(x=>x.done).length} / ${ex.sets}组完成</p></div><div class="value" style="font-weight:650">${a.map((x,i)=>x.done?`${i+1}: ${x.weight!==''?esc(x.weight)+'kg × ':''}${x.reps!==''?esc(x.reps)+'次':'已打卡'}`:null).filter(Boolean).join('<br>')||'—'}</div></div>`}).join('');modal(`<div class="eyebrow">SESSION / HISTORY</div><h2>${esc(title)}</h2><p>${esc(date)} · ${allSets(s)}组完成</p>${rows}<div class="notice" style="margin-top:12px">备注：${esc(s.note||'无')}</div><div class="modal-actions"><button class="secondary" data-close-modal="1">关闭</button><button class="primary" data-edit-history="${esc(key)}">编辑本次训练</button></div>`)}

function applyCheck(button){const row=button.closest('.set-row'),exId=row.dataset.ex,j=Number(row.dataset.set),ex=EXERCISES[chosenDay].find(e=>e.id===exId),xs=exSets(ex),set=xs[j];set.done=!set.done;if(set.done&&!getSession().startedAt)getSession().startedAt=new Date().toISOString();row.classList.toggle('done',set.done);button.textContent=set.done?'✓':'○';button.setAttribute('aria-pressed',set.done?'true':'false');getSession().completedAt=null;save();renderAfterSet();if(set.done&&data.settings.autoTimer)startTimer(ex.rest)}

let chosenInsight='bench';
function makeInsightStats(id){
 const all=Object.keys(data.sessions).filter(k=>data.sessions[k]?.completedAt).sort();
 const perDay=[];
 for(const key of all){const sets=data.sessions[key]?.sets?.[id];if(!Array.isArray(sets))continue;
   const validSets=sets.filter(x=>x.done&&Number(x.weight)>0&&Number(x.reps)>0);
   if(!validSets.length)continue;
   const maxWeight=Math.max(...validSets.map(x=>Number(x.weight)));
   const maxVolume=Math.round(validSets.reduce((a,x)=>a+Number(x.weight)*Number(x.reps),0));
   const candidates=validSets.filter(x=>Number(x.reps)<=12).map(x=>Number(x.weight)*(1+Number(x.reps)/30));
   perDay.push({date:key.slice(0,10),maxWeight,volume:maxVolume,e1rm:candidates.length?Math.max(...candidates):null,sets:validSets});
 }
 return perDay;
}
function insightSuggestion(id,items){
 if(items.length<2)return '再记录至少2次该动作后，可以观察重复表现和负荷进步。';
 const recent=items.slice(-2),range=(EXERCISES.mon.concat(EXERCISES.tue,EXERCISES.thu,EXERCISES.sat).find(x=>x.id===id)?.reps||'8–12').match(/\d+/g)||[];
 const upper=Number(range.at(-1)||12);
 const high=recent.every(x=>x.sets.length>0&&x.sets.every(s=>Number(s.reps)>=upper)&&x.sets.every(s=>Number(s.weight)>0));
 if(high)return '连续两次训练的有效组均达到目标次数上限。下次可考虑小幅加重，并保留1–3次余力。';
 const last=recent[1],before=recent[0];
 if(last.maxWeight>before.maxWeight)return '最近一次工作重量比前一次提高了。先稳定动作质量，再考虑继续增加重量。';
 if(last.volume>before.volume)return '最近一次训练容量有所提高。继续记录，观察多次训练后的整体趋势。';
 return '近期负荷比较稳定，继续关注规范动作、恢复情况和次数递进，不需要每次强行加重。';
}
function renderV4Insights(){

 const valid1rms=items.filter(x=>x.e1rm!==null),estimated=valid1rms.length?Math.max(...valid1rms.map(x=>x.e1rm)):null;
 const recent=items.slice(-9),lo=recent.length?Math.min(...recent.map(x=>x.maxWeight)):0,hi=recent.length?Math.max(...recent.map(x=>x.maxWeight)):0;
 const points=recent.length>1?recent.map((v,i)=>`${(20+i*270/(recent.length-1)).toFixed(1)},${(96-(v.maxWeight-lo)/(hi-lo||1)*64).toFixed(1)}`).join(' '):'';
 const chart=recent.length>1?`<svg viewBox="0 0 320 132" role="img" aria-label="最近${recent.length}次最大训练重量变化"><path d="M20 34H290M20 65H290M20 96H290" stroke="#b4d9ef" stroke-dasharray="3 5"/><polyline points="${points}" stroke="#2893d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>${recent.map((v,i)=>`<circle cx="${(20+i*270/(recent.length-1)).toFixed(1)}" cy="${(96-(v.maxWeight-lo)/(hi-lo||1)*64).toFixed(1)}" r="4" fill="#fff" stroke="#288bd0" stroke-width="2"><title>${esc(v.date)} · ${v.maxWeight}kg</title></circle>`).join('')}<text x="20" y="119" fill="#648fab" font-size="10">${esc(recent[0].date.slice(5))}</text><text x="290" y="119" text-anchor="end" fill="#648fab" font-size="10">${esc(recent.at(-1).date.slice(5))}</text></svg>`:'<div class="onboard">至少两次有效训练后，显示最大工作重量变化曲线。</div>';
 return `<div class="section-header"><div><h2>训练洞察 <small class="new-mark">V4.0</small></h2><p>参考成熟训练日志的 PR 与单动作进步追踪</p></div></div>
 <div class="panel soft fw-insight"><label class="form-field">选择要分析的力量动作<select class="field" id="insight-select">${all.map(x=>`<option value="${esc(x.id)}" ${x.id===selected.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
 <div class="insight-metrics"><div><small>历史最大工作重量</small><b>${best!==null?best+' kg':'—'}</b></div><div><small>估算 1RM · 仅供参考</small><b>${estimated!==null?estimated.toFixed(1)+' kg':'—'}</b></div><div><small>已记录训练次数</small><b>${items.length}</b></div></div>
 <div class="insight-chart">${chart}</div><div class="insight-advice"><b>渐进训练建议</b><p>${esc(insightSuggestion(selected.id,items))}</p></div>
 <p class="subtle-info">重量取该动作单次训练的最大有效工作重量；仅用1–12次重复的有效组计算 Epley 估算1RM。不同机器的配重不可直接比较，估算值不等于实测最大力量。</p></div>`;
}

 if(b.dataset.wipe){modal(`<div class="eyebrow">DANGER / DELETE</div><h2>删除所有本机数据？</h2><p>将清空力量训练、爬楼、快走和身体指标记录。该操作无法恢复，建议先导出 JSON。</p><div class="modal-actions"><button class="secondary" data-close-modal="1">取消</button><button class="secondary danger" data-confirm-wipe="1">删除全部</button></div>`);return}
 if(b.dataset.confirmWipe){data=defaultData();applyPlanOverrides();save();closeModal();renderSettings();toast('已清空本机记录');return}
}
document.addEventListener('click',onClick);
document.addEventListener('change',e=>{if(e.target?.id==='insight-select'){chosenInsight=e.target.value;renderProgress();}});
document.addEventListener('input',e=>{if(e.target.matches('.set-input'))setField(e);if(e.target.matches('#focus-weight,#focus-reps'))focusFields();if(e.target.id==='session-note'){getSession().note=e.target.value;save()}});
document.addEventListener('submit',e=>{if(e.target.id==='body-form'){e.preventDefault();const f=new FormData(e.target),date=String(f.get('date')),weight=Number(f.get('weight')),waist=String(f.get('waist'));if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(weight)||weight<20||weight>300){toast('请填写合理的日期和体重');return}if(waist!==''&&(!Number.isFinite(Number(waist))||Number(waist)<30||Number(waist)>200)){toast('请检查腰围');return}data.body=data.body.filter(x=>x.date!==date);data.body.push({date,weight,waist:waist===''?null:Number(waist)});data.body.sort((a,b)=>a.date.localeCompare(b.date));save();renderProgress();toast('身体数据已保存')}});
el('import-file').addEventListener('change',importFile);
el('overlay').addEventListener('click',e=>{if(e.target===el('overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
renderCurrent();
hydrateMascot();
})();
</script>
<script>
(()=>{
  const key='whalefit_ocean_mode_v1';
  const btn=document.getElementById('ocean-mode');
  let mode='day';try{mode=localStorage.getItem(key)||'day'}catch(e){}
  function apply(){document.body.classList.toggle('ocean-night',mode==='night');btn.textContent=mode==='night'?'☀':'☾';btn.title=mode==='night'?'切换浅海模式':'切换深海模式';btn.setAttribute('aria-label',btn.title)}
  btn.addEventListener('click',()=>{mode=mode==='night'?'day':'night';try{localStorage.setItem(key,mode)}catch(e){}apply()});apply();
})();
</script>
